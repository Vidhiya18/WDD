<!DOCTYPE html>
<html>
<head>
<title>Pet Adoption Form</title>
</head>

<body bgcolor="#FCFCF8">

<center>

<font face="Georgia" color="#0B3D2E" size="7">

<b>PET ADOPTION APPLICATION</b>

</font>

<br><br>

<form>

<table border="0" cellpadding="12" width="70%">

<tr>

<td><b>Full Name</b></td>

<td><input type="text" size="40"></td>

</tr>

<tr>

<td><b>Email</b></td>

<td><input type="email" size="40"></td>

</tr>

<tr>

<td><b>Phone Number</b></td>

<td><input type="tel" size="40"></td>

</tr>

<tr>

<td><b>Age</b></td>

<td><input type="number"></td>

</tr>

<tr>

<td><b>Date of Birth</b></td>

<td><input type="date"></td>

</tr>

<tr>

<td><b>Gender</b></td>

<td>

<input type="radio" name="gender"> Male

<input type="radio" name="gender"> Female

<input type="radio" name="gender"> Other

</td>

</tr>

<tr>

<td><b>Preferred Pet</b></td>

<td>

<select>

<option>Dog</option>

<option>Cat</option>

<option>Rabbit</option>

<option>Bird</option>

</select>

</td>

</tr>

<tr>

<td><b>Experience with Pets</b></td>

<td>

<input type="checkbox"> Dogs

<input type="checkbox"> Cats

<input type="checkbox"> Birds

<input type="checkbox"> Rabbits

</td>

</tr>

<tr>

<td><b>Address</b></td>

<td>

<textarea rows="5" cols="42"></textarea>

</td>

</tr>

<tr>

<td><b>Occupation</b></td>

<td><input type="text" size="40"></td>

</tr>

<tr>

<td><b>Monthly Income</b></td>

<td>

<input type="range" min="10000" max="100000">

</td>

</tr>

<tr>

<td><b>Upload ID Proof</b></td>

<td>

<input type="file">

</td>

</tr>

<tr>

<td><b>Preferred Visit Time</b></td>

<td>

<input type="time">

</td>

</tr>

<tr>

<td><b>Favorite Color for Collar</b></td>

<td>

<input type="color">

</td>

</tr>

<tr>

<td><b>Why do you want to adopt?</b></td>

<td>

<textarea rows="6" cols="42"></textarea>

</td>

</tr>

<tr>

<td colspan="2" align="center">

<input type="submit" value="Submit Application">

<input type="reset" value="Reset">

<input type="button" value="Book Shelter Visit">

</td>

</tr>

</table>

</form>

</center>

</body>
</html>
